const CACHE_KEY = 'oral_health_survey_cache_v2';
let cachedDB = { pre:[], post:[] };

function loadDB(){ return cachedDB; }   // 동기 호출용 (캐시 반환)

async function fetchDB(){
  try {
    const [{data: pre, error: e1}, {data: post, error: e2}] = await Promise.all([
      sb.from('pre_surveys').select('*').order('submitted_at', {ascending:false}),
      sb.from('post_surveys').select('*').order('submitted_at', {ascending:false}),
    ]);
    if(e1) throw e1; if(e2) throw e2;
    cachedDB = {
      pre:  (pre  || []).map(rowFromSupabase),
      post: (post || []).map(rowFromSupabase),
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(cachedDB));
    return cachedDB;
  } catch(err) {
    console.error('Supabase fetch 실패, 캐시 사용:', err);
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(c) cachedDB = c;
    } catch(e){}
    return cachedDB;
  }
}

// Supabase row(snake_case + jsonb) → 앱 row(camelCase + array)
function rowFromSupabase(r){
  return {
    id: r.id,
    submittedAt: r.submitted_at,
    kindergarten: r.kindergarten,
    childName: r.child_name,
    guardianName: r.guardian_name,
    relation: r.relation,
    gender: r.gender,
    age: r.age,
    q1: r.q1 || [],
    q2: r.q2,
    q3: r.q3,
    q4: r.q4,
    q5: r.q5 || [],
    q6: r.q6,
    q7a: r.q7a,
    q7b: r.q7b || [],
    q7b_etc: r.q7b_etc || '',
    q8: r.q8,
    q9: r.q9,
    q10: r.q10 || [],
    q11: r.q11,
  };
}

// 앱 row → Supabase row(snake_case)
function rowToSupabase(d, type){
  const row = {
    kindergarten: d.kindergarten,
    child_name: d.childName,
    guardian_name: d.guardianName,
    relation: d.relation,
    gender: d.gender,
    age: d.age,
    q1: d.q1, q2: d.q2, q3: d.q3, q4: d.q4, q5: d.q5,
    q6: d.q6, q7a: d.q7a, q7b: d.q7b, q7b_etc: d.q7b_etc || null, q8: d.q8,
  };
  if(type === 'post') {
    row.q9 = d.q9;
    row.q10 = d.q10;
    row.q11 = d.q11;
  }
  return row;
}

function renderQuestion(q, color){
  const required = q.type !== 'check' ? 'required' : '';
  if(q.type === 'radio'){
    return `
    <div class="bg-slate-50/50 rounded-xl p-4 border border-slate-200">
      <p class="font-semibold text-slate-800 mb-3">${q.label}</p>
      ${q.sub?`<p class="text-xs text-slate-500 mb-2">${q.sub}</p>`:''}
      <div class="space-y-2">
        ${q.options.map((opt,i)=>`
          <label class="radio-card flex items-center gap-3 border-2 border-slate-200 rounded-lg px-4 py-3 cursor-pointer hover:bg-white">
            <input type="radio" name="${q.id}" value="${i+1}" ${required} class="w-4 h-4 accent-${color}-600">
            <span class="text-sm">${i+1>9?'⑩':['①','②','③','④','⑤','⑥','⑦','⑧','⑨'][i]} ${opt}</span>
          </label>`).join('')}
      </div>
    </div>`;
  }
  if(q.type === 'check'){
    return `
    <div class="bg-slate-50/50 rounded-xl p-4 border border-slate-200">
      <p class="font-semibold text-slate-800 mb-1">${q.label}</p>
      ${q.sub?`<p class="text-xs text-slate-500 mb-3">${q.sub}</p>`:''}

            <input type="checkbox" name="${q.id}" value="${opt}" class="w-4 h-4 accent-${color}-600">
            <span class="text-sm">${opt}</span>
          </label>`).join('')}
      </div>
      ${q.allowEtc?`<input type="text" name="${q.id}_etc" placeholder="기타 종류 입력" class="mt-3 w-full px-4 py-2 rounded-lg border border-slate-300 text-sm">`:''}
    </div>`;
  }
  if(q.type === 'number'){
    return `
    <div class="bg-slate-50/50 rounded-xl p-4 border border-slate-200">
      <p class="font-semibold text-slate-800 mb-1">${q.label}</p>
      ${q.sub?`<p class="text-xs text-slate-500 mb-3">${q.sub}</p>`:''}

        <input type="number" name="${q.id}" required min="${q.min||0}" max="${q.max||50}" class="w-28 px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-${color}-400 outline-none text-center font-semibold">
        <span class="text-sm text-slate-600">회</span>
      </div>
    </div>`;
  }
}

/* ====== 제출 처리 ====== */
async function submitSurvey(type){
  const form = document.getElementById('surveyForm');
  const submitBtn = form.querySelector('button[type="submit"]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.innerHTML = '⏳ 제출 중...'; }

  const data = {};
  ['kindergarten','childName','guardianName','relation','gender','age'].forEach(k=>{
    data[k] = form.elements[k].value.trim();
  });
  const questions = type==='pre' ? COMMON_Q : [...COMMON_Q, ...POST_EXTRA_Q];
  for(const q of questions){
    if(q.type === 'check'){
      const checked = Array.from(form.querySelectorAll(`input[name="${q.id}"]:checked`)).map(i=>i.value);
      data[q.id] = checked;
      if(q.allowEtc){
        const etc = form.elements[`${q.id}_etc`]?.value?.trim();
        if(etc) data[`${q.id}_etc`] = etc;
      }
    } else if(q.type === 'radio'){
      const sel = form.querySelector(`input[name="${q.id}"]:checked`);
      data[q.id] = sel ? Number(sel.value) : null;
    } else if(q.type === 'number'){
      data[q.id] = Number(form.elements[q.id].value);
    }
  }

  // Supabase insert
  try {
    const table = type === 'pre' ? 'pre_surveys' : 'post_surveys';
    const { error } = await sb.from(table).insert([rowToSupabase(data, type)]);
    if(error) throw error;
    await fetchDB();
    go('thanks-' + type);
  } catch(err) {
    alert('제출 중 오류가 발생했습니다.\n\n' + (err?.message || err) + '\n\n네트워크 상태를 확인하시고 다시 시도해 주세요.');
    if(submitBtn){ submitBtn.disabled = false; submitBtn.innerHTML = type==='pre'?'사전 설문 제출하기 →':'사후 설문 제출하기 →'; }
  }
}

/* ====== 사전·사후 매칭 (유치원명 + 아동명 기준) ====== */
function matchPrePost(db){
  const matched = [];
  db.pre.forEach(p=>{
    const post = db.post.find(po =>
      po.kindergarten === p.kindergarten && po.childName === p.childName);
    if(post) matched.push({pre:p, post:post});
  });
  return matched;
}

            <td class="px-2 py-1.5 border border-slate-200 text-center">${r.gender}/${r.age}</td>
            <td class="px-2 py-1.5 border border-slate-200">${r.guardianName}(${r.relation})</td>
            ${questions.map(q=>`<td class="px-2 py-1.5 border border-slate-200">${formatAnswer(r[q.id], q)}</td>`).join('')}

function formatAnswer(v, q){
  if(v == null || v === '') return '<span class="text-slate-300">-</span>';
  if(Array.isArray(v)) return v.join(', ');
  if(q.type === 'radio') return `${v}. ${q.options[v-1] ?? ''}`;
  return v;
}
function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function downloadExcel(){
  const db = loadDB();
  const matched = matchPrePost(db);
  const wb = XLSX.utils.book_new();

  // 시트1: 사전 데이터
  const preRows = db.pre.map((r,i)=>buildExcelRow(r, COMMON_Q, i+1));
  if(preRows.length){
    const ws = XLSX.utils.json_to_sheet(preRows);
    XLSX.utils.book_append_sheet(wb, ws, '1.사전 데이터');
  } else {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['응답 없음']]), '1.사전 데이터');
  }

  // 시트2: 사후 데이터

    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['응답 없음']]), '2.사후 데이터');
  }

  // 시트3: 사전·사후 비교 분석
  if(matched.length){
    const cmpRows = matched.map((m,i)=>({
      'No': i+1,
      '유치원': m.pre.kindergarten,
      '아동': m.pre.childName,
      '성별': m.pre.gender,
      '연령': m.pre.age,
      '[Q2]칫솔질 횟수(사전)': m.pre.q2,
      '[Q2]칫솔질 횟수(사후)': m.post.q2,
      '[Q2]변화': numDelta(m.pre.q2, m.post.q2),
      '[Q3]스스로(사전)': labelOf(COMMON_Q[2], m.pre.q3),
      '[Q3]스스로(사후)': labelOf(COMMON_Q[2], m.post.q3),
      '[Q4]방법(사전)': labelOf(COMMON_Q[3], m.pre.q4),
      '[Q4]방법(사후)': labelOf(COMMON_Q[3], m.post.q4),
      '[Q6]마무리양치(사전)': labelOf(COMMON_Q[5], m.pre.q6),
      '[Q6]마무리양치(사후)': labelOf(COMMON_Q[5], m.post.q6),
      '[Q7a]간식 횟수(사전)': m.pre.q7a,
      '[Q7a]간식 횟수(사후)': m.post.q7a,
      '[Q7a]변화': numDelta(m.pre.q7a, m.post.q7a),
      '[Q8]불소인지(사전)': labelOf(COMMON_Q[7], m.pre.q8),
      '[Q8]불소인지(사후)': labelOf(COMMON_Q[7], m.post.q8),
      '[Q9]교육 만족도(재미·이해도)': labelOf(POST_EXTRA_Q[0], m.post.q9),
      '[Q10]행동 변화(다중)': Array.isArray(m.post.q10) ? m.post.q10.join(' / ') : '',
      '[Q11]프로그램 지속 의향': labelOf(POST_EXTRA_Q[2], m.post.q11),
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cmpRows), '3.사전·사후 비교');
  } else {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['매칭된 응답 없음']]), '3.사전·사후 비교');

  // 시트4: 통계 요약
  const stats = buildStats(db, matched);

  // 시트5: 시각화용 (피벗 데이터)

  XLSX.writeFile(wb, fname);
}

function buildExcelRow(r, questions, no){
  const row = {
    'No': no,
    '제출일시': formatDate(r.submittedAt),
    '유치원명': r.kindergarten,
    '아동성명': r.childName,
    '아동성별': r.gender,
    '아동연령': r.age,
    '주양육자': r.guardianName,
    '관계': r.relation,
  };
  questions.forEach(q=>{
    let v = r[q.id];
    if(Array.isArray(v)) v = v.join(', ');
    else if(q.type==='radio' && v) v = `${v}. ${q.options[v-1]}`;
    row[q.id.toUpperCase()+'. '+q.label.replace(/^\d+\.\s*/,'').slice(0,30)] = v ?? '';
    if(q.allowEtc && r[q.id+'_etc']) row[q.id.toUpperCase()+'_기타'] = r[q.id+'_etc'];
  });
  return row;
}
function labelOf(q, v){ if(v==null) return ''; return q.options[v-1] ? `${v}. ${q.options[v-1]}` : v; }
function numDelta(a,b){ if(a==null||b==null) return ''; const d=b-a; return d>0?`+${d}`:String(d); }

function buildStats(db, matched){
  const avg = arr => arr.length ? (arr.reduce((a,b)=>a+(+b||0),0)/arr.length).toFixed(2) : '-';
  const distQ = (records, qid, opts) => opts.map((o,i)=> records.filter(r=>r[qid]===i+1).length );
  const rows = [
    ['통계 요약 보고서','','','',''],
    ['', '', '', '', ''],
    ['생성일', new Date().toLocaleString('ko-KR')],
    ['', ''],
    ['1. 응답 현황'],
    ['항목','건수'],
    ['사전 응답', db.pre.length],
    ['사후 응답', db.post.length],

/* ====== PDF 보고서 다운로드 (섹션 단위 페이지 분할) ====== */
async function downloadPDF(){
  const db = loadDB();
  const matched = matchPrePost(db);
  const reportEl = document.createElement('div');
  reportEl.id = 'pdfReport';
  reportEl.style.cssText = 'position:fixed; left:-99999px; top:0; background:white; width:794px; padding:40px; font-family:Pretendard, sans-serif;';
  reportEl.innerHTML = buildPdfHtml(db, matched);
  document.body.appendChild(reportEl);
  // 폰트/차트 로딩 대기
  await new Promise(r=>setTimeout(r,100));
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  drawPdfCharts(db);
  await new Promise(r=>setTimeout(r,900));

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const pdfW = 210, pdfH = 297;
  const margin = 12; // mm
  const usableW = pdfW - margin*2;
  const usableH = pdfH - margin*2;

  const sections = reportEl.querySelectorAll('.pdf-section');
  let currentY = margin;
  let firstOnPage = true;

  for(const section of sections){
    const canvas = await html2canvas(section, {scale:2, useCORS:true, backgroundColor:'#ffffff'});
    const imgW = usableW;
    const imgH_mm = canvas.height * imgW / canvas.width;

    // 한 섹션이 한 페이지보다 큰 경우 → 캔버스를 잘라서 여러 페이지에 분할
    if(imgH_mm > usableH){
      if(!firstOnPage){ pdf.addPage(); currentY = margin; firstOnPage = true; }
      const pxPerMm = canvas.width / imgW;
      const sliceHpx = Math.floor(usableH * pxPerMm);
      let yPx = 0;
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      const ctx = sliceCanvas.getContext('2d');
      while(yPx < canvas.height){
        const thisHpx = Math.min(sliceHpx, canvas.height - yPx);
        sliceCanvas.height = thisHpx;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,sliceCanvas.width, thisHpx);
        ctx.drawImage(canvas, 0, yPx, canvas.width, thisHpx, 0, 0, canvas.width, thisHpx);
        const sliceImg = sliceCanvas.toDataURL('image/jpeg', 0.92);
        const thisHmm = thisHpx / pxPerMm;
        if(!firstOnPage){ pdf.addPage(); currentY = margin; }
        pdf.addImage(sliceImg, 'JPEG', margin, currentY, imgW, thisHmm);
        currentY += thisHmm;
        yPx += thisHpx;
        firstOnPage = false;
      }
      currentY += 4;
      continue;
    }

    // 자리 부족하면 다음 페이지로 (현재 페이지 윗공간이 남더라도)
    if(!firstOnPage && (currentY + imgH_mm) > (pdfH - margin)){
      pdf.addPage();
      currentY = margin;
      firstOnPage = true;
    }
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    pdf.addImage(imgData, 'JPEG', margin, currentY, imgW, imgH_mm);
    currentY += imgH_mm + 4;
    firstOnPage = false;
  }

  pdf.save(`유아구강보건교육_보고서_${new Date().toISOString().slice(0,10)}.pdf`);
  reportEl.remove();
}

function diffStr(a,b,reverse=false){
  const av = parseFloat(a), bv = parseFloat(b);
  if(isNaN(av)||isNaN(bv)) return '-';
  const d = (bv-av).toFixed(2);
  if(d == 0) return `<span style="color:#64748b">±0</span>`;
  const positive = d > 0;
  const isImproved = reverse ? !positive : positive;
  const color = isImproved ? '#059669' : '#dc2626';
  const arrow = positive ? '↑' : '↓';
  return `<span style="color:${color};font-weight:bold">${positive?'+':''}${d} ${arrow}</span>`;
}

  if(db.pre.length===0 && db.post.length===0) return '<p style="margin:0;">아직 수집된 응답이 없습니다.</p>';

  const avg = arr => arr.length ? (arr.reduce((a,b)=>a+(+b||0),0)/arr.length) : 0;
  const pct = (cnt, total)=> total ? Math.round(cnt/total*100) : 0;

  const avgPre   = avg(db.pre.map(r=>r.q2));
  const avgPost  = avg(db.post.map(r=>r.q2));
  const snackPre = avg(db.pre.map(r=>r.q7a));
  const snackPost= avg(db.post.map(r=>r.q7a));

  const finPre  = db.pre.filter(r=>r.q6===1||r.q6===2).length;
  const finPost = db.post.filter(r=>r.q6===1||r.q6===2).length;
  const finPreP = pct(finPre, db.pre.length);
  const finPostP= pct(finPost, db.post.length);

  const fluPre  = db.pre.filter(r=>r.q8===1||r.q8===2).length;
  const fluPost = db.post.filter(r=>r.q8===1||r.q8===2).length;
  const fluPreP = pct(fluPre, db.pre.length);
  const fluPostP= pct(fluPost, db.post.length);

  const satisGood = db.post.filter(r=>r.q9===1||r.q9===2).length;
  const satisRate = pct(satisGood, db.post.length);
  const intentGood= db.post.filter(r=>r.q11===1||r.q11===2).length;
  const intentRate= pct(intentGood, db.post.length);

  // Q10 행동 변화 상위 3개
  const q10Items = POST_EXTRA_Q[1].options;
  const q10Counts = q10Items.map(it => db.post.filter(r => Array.isArray(r.q10) && r.q10.includes(it)).length);
  const top3 = q10Items.map((o,i)=>({o, c:q10Counts[i]}))
                .filter(x => x.o !== '특별한 변화를 느끼지 못했다')
                .sort((a,b)=>b.c-a.c)
                .slice(0,3)
                .filter(x => x.c > 0);

  // 변화 해석 문구
  const brushDelta = avgPost - avgPre;
  const brushDir = brushDelta >= 0.1 ? `<b style="color:#059669">${brushDelta.toFixed(2)}회 증가</b>하여 칫솔질 빈도가 개선된 것으로 나타났습니다`
                  : brushDelta <= -0.1 ? `<b style="color:#dc2626">${Math.abs(brushDelta).toFixed(2)}회 감소</b>하였습니다`
                  : '큰 변화 없이 유사한 수준을 유지하였습니다';
  const fluDelta = fluPostP - fluPreP;
  const fluDir = fluDelta >= 5 ? `사전 ${fluPreP}% → 사후 ${fluPostP}%로 <b style="color:#059669">${fluDelta}%p 상승</b>하여 교육 효과가 확인됩니다`
                : fluDelta <= -5 ? `사전 ${fluPreP}% → 사후 ${fluPostP}%로 <b style="color:#dc2626">${Math.abs(fluDelta)}%p 감소</b>하였습니다`
                : `사전 ${fluPreP}% → 사후 ${fluPostP}%로 큰 변동은 없으나, 후속 교육을 통해 정착이 필요합니다`;
  const finDelta = finPostP - finPreP;
  const finDir = finDelta >= 5 ? `사전 ${finPreP}% → 사후 ${finPostP}%로 <b style="color:#059669">${finDelta}%p 상승</b>` 
                : finDelta <= -5 ? `사전 ${finPreP}% → 사후 ${finPostP}%로 ${Math.abs(finDelta)}%p 감소`
                : `사전 ${finPreP}% → 사후 ${finPostP}%로 비슷한 수준`;

  return `
    <p style="margin:0 0 10px 0;"><b>① 응답 현황.</b>
      본 보고서는 사전 <b>${db.pre.length}건</b>, 사후 <b>${db.post.length}건</b>의 응답을 토대로 작성되었으며, 사전·사후 모두 응답한 매칭 표본은 <b>${matched.length}쌍</b>입니다. 매칭 표본은 동일 아동의 변화를 직접 추적하는 핵심 자료로 활용되었습니다.
    </p>
    <p style="margin:0 0 10px 0;"><b>② 칫솔질 빈도 변화.</b>
      하루 평균 칫솔질 횟수는 사전 <b>${avgPre.toFixed(2)}회</b>에서 사후 <b>${avgPost.toFixed(2)}회</b>로 ${brushDir}. 한편 하루 평균 간식 횟수는 사전 ${snackPre.toFixed(2)}회에서 사후 ${snackPost.toFixed(2)}회로 변화하였습니다.
    </p>
    <p style="margin:0 0 10px 0;"><b>③ 부모의 마무리 양치 참여.</b>
      '매번' 또는 '가끔' 마무리 양치를 해주는 비율은 ${finDir}하였습니다. 부모의 적극적인 마무리 양치 참여는 만 5~7세 아동의 치아우식 예방에서 가장 강력한 보호 요인이므로, 가정 내 실천이 지속되도록 안내가 필요합니다.
    </p>
    <p style="margin:0 0 10px 0;"><b>④ 불소 역할에 대한 인지도.</b>
      불소 역할에 대해 '잘 이해' 또는 '대략 안다'고 응답한 비율은 ${fluDir}.
    </p>
    <p style="margin:0 0 10px 0;"><b>⑤ 사후 만족도 평가.</b>
      교육의 재미·이해도에 대해 '매우 그렇다·그렇다'고 응답한 비율은 <b style="color:#0f766e">${satisRate}%</b>, 프로그램이 정기적으로 진행되기를 '매우 원한다·원한다'고 응답한 비율은 <b style="color:#0f766e">${intentRate}%</b>로 나타났습니다.
      ${top3.length ? `학부모가 관찰한 교육 후 주요 행동 변화는 <b>${top3.map(x=>`${x.o} (${x.c}건)`).join(', ')}</b> 순이었으며, 이는 단순 지식 전달을 넘어 실제 행동·태도 변화로 이어졌음을 시사합니다.` : '학부모가 관찰한 교육 후 행동 변화 응답이 아직 충분하지 않아, 추가 응답 수집 후 재분석이 필요합니다.'}
    </p>
    <p style="margin:0;"><b>⑥ 종합 평가 및 제언.</b>
      이번 구강보건교육은 아동의 기본 행동(칫솔질·간식)·보조 행동(마무리 양치)·인지(불소 역할)의 세 측면 모두에 영향을 미친 것으로 분석되며, 학부모 만족도(${satisRate}%)와 지속 의향(${intentRate}%) 또한 양호한 수준입니다.
      향후에는 ① 가정 연계 활동(체크리스트·실천 카드) 병행으로 행동 정착 강화, ② 교육 종료 후 1~3개월 시점 추적 조사로 행동 유지율 확인, ③ 매칭 ${matched.length}쌍에 대한 개별 변화 데이터 심층 분석을 권장합니다.
      세부 개별 응답은 첨부 엑셀 파일을 참고해 주시기 바랍니다.
    </p>
  `;
}

function drawPdfCharts(db){
  const distQ = (records, qid, n) => Array.from({length:n}, (_,i)=> records.filter(r=>r[qid]===i+1).length);
  const opts = {responsive:false, animation:false, plugins:{legend:{labels:{font:{size:10}}}}, scales:{y:{beginAtZero:true, ticks:{stepSize:1, font:{size:9}}}, x:{ticks:{font:{size:9}}}}};
  new Chart(document.getElementById('pdf_chart_q8'), {
    type:'bar',
    data:{labels:['잘 이해','대략 안다','이름만','전혀 모름'],
      datasets:[{label:'사전', data:distQ(db.pre,'q8',4), backgroundColor:'#14b8a6'},
                {label:'사후', data:distQ(db.post,'q8',4), backgroundColor:'#f59e0b'}]},
    options:opts
  });
  new Chart(document.getElementById('pdf_chart_q3'), {
    type:'bar',
    data:{labels:[['끝까지','스스로'],['대부분','스스로'],['부모가','닦아줌']],
      datasets:[{label:'사전', data:distQ(db.pre,'q3',3), backgroundColor:'#14b8a6'},
                {label:'사후', data:distQ(db.post,'q3',3), backgroundColor:'#f59e0b'}]},
    options:opts
  });
  new Chart(document.getElementById('pdf_chart_q6'), {
    type:'bar',
    data:{labels:['매번 마무리','가끔 마무리','확인만','확인안함'],
      datasets:[{label:'사전', data:distQ(db.pre,'q6',4), backgroundColor:'#14b8a6'},
                {label:'사후', data:distQ(db.post,'q6',4), backgroundColor:'#f59e0b'}]},
    options:opts
  });
  new Chart(document.getElementById('pdf_chart_q9'), {
    type:'doughnut',
    data:{labels:['매우 그렇다','그렇다','보통이다','그렇지 않다','전혀 그렇지 않다'],
      datasets:[{data:distQ(db.post,'q9',5), backgroundColor:['#10b981','#14b8a6','#f59e0b','#fb923c','#f43f5e']}]},
    options:{responsive:false, animation:false, plugins:{legend:{position:'bottom', labels:{font:{size:10}}}}}
  });
  if(document.getElementById('pdf_chart_q11')){
    new Chart(document.getElementById('pdf_chart_q11'), {
      type:'doughnut',
      data:{labels:['매우 원한다','원한다','보통','원하지 않는다'],
        datasets:[{data:distQ(db.post,'q11',4), backgroundColor:['#10b981','#14b8a6','#f59e0b','#f43f5e']}]},
      options:{responsive:false, animation:false, plugins:{legend:{position:'bottom', labels:{font:{size:10}}}}}
    });
  }
  if(document.getElementById('pdf_chart_q10')){
    const q10Items = ['칫솔질을 더 자주 하려고 한다','칫솔 잡는 방법이나 닦는 방법(둥글게 닦기 등)이 달라졌다','단 음식·간식을 먹을 때 스스로 조심한다','충치·불소·치아에 대해 먼저 이야기한다','치과에 대한 두려움이 줄었다','특별한 변화를 느끼지 못했다'];
    const q10Counts = q10Items.map(it => db.post.filter(r => Array.isArray(r.q10) && r.q10.includes(it)).length);
    new Chart(document.getElementById('pdf_chart_q10'), {
      type:'bar',
      data:{labels:q10Items.map(s => s.length>16 ? s.slice(0,16)+'…' : s),
        datasets:[{label:'응답 수', data:q10Counts, backgroundColor:'#0d9488'}]},
      options:{responsive:false, animation:false, indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{stepSize:1, font:{size:9}}}, y:{ticks:{font:{size:9}}}}}
    });
  }
}

/* ====== JSON 백업/삭제 ====== */
function downloadJSON(){
  const db = loadDB();
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `구강보건교육_백업_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
async function clearAllData(){
  const confirm1 = prompt("정말로 Supabase의 모든 응답 데이터를 삭제하시려면 '삭제확인' 이라고 입력하세요.");
  if(confirm1 !== '삭제확인') return;
  try {
    const [{error: e1}, {error: e2}] = await Promise.all([
      sb.from('pre_surveys').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
      sb.from('post_surveys').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
    ]);
    if(e1) throw e1; if(e2) throw e2;
    await fetchDB();
    alert('전체 데이터가 삭제되었습니다.');
    render();
  } catch(err) {
    alert('삭제 실패: ' + (err?.message || err) + '\n\n※ Supabase RLS의 DELETE 정책이 비활성화되어 있을 수 있습니다.\nSQL 스키마 파일 하단의 주석을 해제 후 재실행해 주세요.');
  }
}

/* ====== 초기 실행 ====== */
(async function init(){
  // 즉시 캐시 표시 → 백그라운드에서 fetch
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c) cachedDB = c;
  } catch(e){}
  render();
  await fetchDB();
  if(currentRoute === 'home' || currentRoute === 'admin') render();
})();
</script>
